[project]
name = "multi-agent-lark-ops"
version = "0.1.0"
description = "A multi-agent workflow system for Lark/Feishu-based team operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.6",
    "openai>=2.0",
    "openai-agents>=0.18",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
lark-agents = "multi_agent_lark_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_lark_ops"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
